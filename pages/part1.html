<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵犀指令库 · 内容创作</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <nav class="nav-bar">
      <span class="nav-brand">灵犀指令库</span>
      <ul class="nav-menu">
        <li class="nav-item"><a href="../index.html">首页</a></li>
      </ul>
    </nav>
    <div id="stars"></div><div id="stars2"></div><div id="stars3"></div>
    <div class="glass-reader">
      <div class="reader-header"><h2>内容创作类</h2></div>
      <div class="reader-content">
        
        <!-- 文案创作 - 已优化：融入拆解+差异化思维 -->
        <div class="prompt-builder prompt-builder--accordion" data-template="你现在是资深{platform}内容运营。请为{audience}创作一段{textType}，核心卖点是{extra}。要求：
1. 风格与节点：采用{style}风格，贴合{time}的语境。
2. 结构与字数：{length}以内。
3. 思维链：先分析同类内容3个常见套路，再产出2个反套路版本，每版附创作思路。">
          <button class="prompt-builder__trigger" type="button" aria-expanded="false">
            <span class="prompt-builder__title">文案创作</span>
            <span class="prompt-builder__arrow">展开</span>
          </button>
          <div class="prompt-builder__body">
            <div class="prompt-builder__desc">短视频、朋友圈、营销、海报文案</div>
            <div class="prompt-builder__fields">
              <label>适用平台<input data-key="platform" type="text" placeholder="例如：小红书"></label>
              <label>时间节点<input data-key="time" type="text" placeholder="例如：双十一预热期"></label>
              <label>文案风格<input data-key="style" type="text" placeholder="例如：轻松种草"></label>
              <label>目标受众<input data-key="audience" type="text" placeholder="例如：25岁上班族"></label>
              <label>文本类型<input data-key="textType" type="text" placeholder="例如：30秒短视频口播"></label>
              <label>字数要求<input data-key="length" type="text" placeholder="例如：120字以内"></label>
              <label class="prompt-builder__wide">补充信息（产品/服务详情）<textarea data-key="extra" rows="3" placeholder="例如：温和保湿面霜，不黏腻、敏感肌可用"></textarea></label>
              <label class="chain-check"><input type="checkbox" data-key="chain"> 启用深度思考（思维链）</label>
            </div>
            <div class="prompt-builder__output" aria-live="polite"></div>
            <button class="copy-button" type="button">一键复制</button>
          </div>
        </div>

        <!-- 文章撰写 - 优化：结构化+受众适配 -->
        <div class="prompt-builder prompt-builder--accordion" data-template="请以{scene}为场景，为{reader}撰写一篇关于{topic}的文章，{length}左右。按{structure}结构行文，突出{focus}。写作前请先列出文章大纲，并确保语言风格适合{reader}。">
          <button class="prompt-builder__trigger" type="button" aria-expanded="false">
            <span class="prompt-builder__title">文章撰写</span>
            <span class="prompt-builder__arrow">展开</span>
          </button>
          <div class="prompt-builder__body">
            <div class="prompt-builder__desc">工作总结、报告、演讲稿、随笔</div>
            <div class="prompt-builder__fields">
              <label>主题<input data-key="topic" type="text" placeholder="例如：AI工具提升办公效率"></label>
              <label>使用场景<input data-key="scene" type="text" placeholder="例如：部门分享"></label>
              <label>目标读者<input data-key="reader" type="text" placeholder="例如：非技术背景同事"></label>
              <label>字数要求<input data-key="length" type="text" placeholder="例如：800"></label>
              <label>文章结构<input data-key="structure" type="text" placeholder="例如：引言+案例+方法+总结"></label>
              <label>重点内容<input data-key="focus" type="text" placeholder="例如：落地方法和注意事项"></label>
              <label class="chain-check"><input type="checkbox" data-key="chain"> 启用深度思考（思维链）</label>
            </div>
            <div class="prompt-builder__output" aria-live="polite"></div>
            <button class="copy-button" type="button">一键复制</button>
          </div>
        </div>

        <!-- 内容优化 - 保持不变，微调说明 -->
        <div class="prompt-builder prompt-builder--accordion" data-template="请对以下内容进行{method}：{content}。使用{style}风格，字数{length}，着重修改{focus}，保留核心信息，适用于{scene}。">
          <button class="prompt-builder__trigger" type="button" aria-expanded="false">
            <span class="prompt-builder__title">内容优化</span>
            <span class="prompt-builder__arrow">展开</span>
          </button>
          <div class="prompt-builder__body">
            <div class="prompt-builder__desc">润色、缩写、扩写、改写、纠错</div>
            <div class="prompt-builder__fields">
              <label>优化方式<input data-key="method" type="text" placeholder="例如：润色并压缩"></label>
              <label>语言风格<input data-key="style" type="text" placeholder="例如：正式、清晰"></label>
              <label>字数要求<input data-key="length" type="text" placeholder="例如：300字以内"></label>
              <label>修改重点<input data-key="focus" type="text" placeholder="例如：逻辑、语气"></label>
              <label>适用表达<input data-key="scene" type="text" placeholder="例如：书面汇报"></label>
              <label class="prompt-builder__wide">原始内容<textarea data-key="content" rows="4" placeholder="粘贴需要优化的文本"></textarea></label>
            </div>
            <div class="prompt-builder__output" aria-live="polite"></div>
            <button class="copy-button" type="button">一键复制</button>
          </div>
        </div>

        <!-- 创意生成 - 优化：增加平台、受众，要求附带说明 -->
        <div class="prompt-builder prompt-builder--accordion" data-template="请围绕{topic}，为{platform}平台的{audience}生成10个{textType}，风格{style}。每个创意附带简短说明，并说明为什么适合该平台。">
          <button class="prompt-builder__trigger" type="button" aria-expanded="false">
            <span class="prompt-builder__title">创意生成</span>
            <span class="prompt-builder__arrow">展开</span>
          </button>
          <div class="prompt-builder__body">
            <div class="prompt-builder__desc">标题、选题、灵感、段子、故事大纲</div>
            <div class="prompt-builder__fields">
              <label>主题<input data-key="topic" type="text" placeholder="例如：新手学习AI写作"></label>
              <label>文本类型<input data-key="textType" type="text" placeholder="例如：小红书标题"></label>
              <label>文本风格<input data-key="style" type="text" placeholder="例如：轻松、有网感"></label>
              <label>适用平台<input data-key="platform" type="text" placeholder="例如：小红书"></label>
              <label>目标受众<input data-key="audience" type="text" placeholder="例如：职场新人"></label>
            </div>
            <div class="prompt-builder__output" aria-live="polite"></div>
            <button class="copy-button" type="button">一键复制</button>
          </div>
        </div>
      </div>
      <div class="reader-footer">✦ 磨砂玻璃视界 · 可承载数万字内容 ✦ 滚动流畅 · 沉浸阅读</div>
    </div>
  </div>
  <script src="prompt-builder.js"></script>
</body>
</html>
