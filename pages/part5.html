<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵犀指令库</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <nav class="nav-bar">
          <span class="nav-brand">灵犀指令库</span>
          <ul class="nav-menu">
              <li class="nav-item"><a href="../index.html">首页</a></li>
          </ul>
    </nav>
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>
    <div class="glass-reader">
        <div class="reader-header">
            <h2>代码生成类</h2>
        </div>
        <div class="reader-content">
            <div class="prompt-builder prompt-builder--accordion" data-template="我是{role}，我需要用{language}写一段代码，实现{need}功能。要求{requirements}，说明输出结果，以及可能出现的错误和解决办法。">
                <button class="prompt-builder__trigger" type="button" aria-expanded="false">
                    <span class="prompt-builder__title">代码生成</span>
                    <span class="prompt-builder__arrow">展开</span>
                </button>
                <div class="prompt-builder__body">
                <div class="prompt-builder__desc">适用于基础语法、功能模块、简单程序、脚本编写。</div>
                <div class="prompt-builder__fields">
                    <label>身份<input data-key="role" type="text" placeholder="例如：前端新手"></label>
                    <label>编程语言<input data-key="language" type="text" placeholder="例如：JavaScript"></label>
                    <label>功能需求<input data-key="need" type="text" placeholder="例如：表单校验"></label>
                    <label>代码要求<input data-key="requirements" type="text" placeholder="例如：每行代码都有注释"></label>
                </div>
                <div class="prompt-builder__output" aria-live="polite"></div>
                <button class="copy-button" type="button">一键复制</button>
                </div>
            </div>
            <div class="prompt-builder prompt-builder--accordion" data-template="以下{language}代码运行时报错：{error}。代码如下：{code}。请帮我找出错误原因并修正。在你给出答案前，先列出{count}种可能出错的位置，再给出最终修正代码。">
                <button class="prompt-builder__trigger" type="button" aria-expanded="false">
                    <span class="prompt-builder__title">代码调试</span>
                    <span class="prompt-builder__arrow">展开</span>
                </button>
                <div class="prompt-builder__body">
                <div class="prompt-builder__desc">适用于错误排查、语法修正、优化建议。</div>
                <div class="prompt-builder__fields">
                    <label>编程语言<input data-key="language" type="text" placeholder="例如：Python"></label>
                    <label>报错信息<input data-key="error" type="text" placeholder="例如：TypeError: ..."></label>
                    <label>排查数量<input data-key="count" type="text" placeholder="例如：3"></label>
                    <label class="prompt-builder__wide">代码内容<textarea data-key="code" rows="5" placeholder="粘贴需要调试的代码"></textarea></label>
                </div>
                <div class="prompt-builder__output" aria-live="polite"></div>
                <button class="copy-button" type="button">一键复制</button>
                </div>
            </div>
            <div class="prompt-builder prompt-builder--accordion" data-template="请解释以下{language}代码的主要用法和功能，假设读者是{audience}。请逐段说明逻辑，并补充时间复杂度、空间复杂度和关键注意事项。代码如下：{code}">
                <button class="prompt-builder__trigger" type="button" aria-expanded="false">
                    <span class="prompt-builder__title">代码解释</span>
                    <span class="prompt-builder__arrow">展开</span>
                </button>
                <div class="prompt-builder__body">
                <div class="prompt-builder__desc">适用于语法说明、逻辑解读、功能说明。</div>
                <div class="prompt-builder__fields">
                    <label>编程语言<input data-key="language" type="text" placeholder="例如：Java"></label>
                    <label>目标读者<input data-key="audience" type="text" placeholder="例如：刚接触Java的开发者"></label>
                    <label class="prompt-builder__wide">代码内容<textarea data-key="code" rows="5" placeholder="粘贴需要解释的代码"></textarea></label>
                </div>
                <div class="prompt-builder__output" aria-live="polite"></div>
                <button class="copy-button" type="button">一键复制</button>
                </div>
            </div>
            <div class="prompt-builder prompt-builder--accordion" data-template="请用{language}开发一个脚本，用于{task}。要求：{requirements}。请在生成脚本前，先思考可能出现的异常情况并给出处理方案，生成代码后说明如何运行。">
                <button class="prompt-builder__trigger" type="button" aria-expanded="false">
                    <span class="prompt-builder__title">脚本开发</span>
                    <span class="prompt-builder__arrow">展开</span>
                </button>
                <div class="prompt-builder__body">
                <div class="prompt-builder__desc">适用于自动化脚本、简单工具脚本。</div>
                <div class="prompt-builder__fields">
                    <label>编程语言<input data-key="language" type="text" placeholder="例如：Python"></label>
                    <label>脚本任务<input data-key="task" type="text" placeholder="例如：提取Excel第一列保存为txt"></label>
                    <label class="prompt-builder__wide">脚本要求<textarea data-key="requirements" rows="4" placeholder="例如：支持大文件读取、记录日志、处理异常"></textarea></label>
                </div>
                <div class="prompt-builder__output" aria-live="polite"></div>
                <button class="copy-button" type="button">一键复制</button>
                </div>
            </div>
        </div>
        <div class="reader-footer">
            ✦ 磨砂玻璃视界 · 可承载数万字内容 ✦ 滚动流畅 · 沉浸阅读
        </div>
    </div>
  </div>
  <script src="prompt-builder.js"></script>

</body>

</html>
