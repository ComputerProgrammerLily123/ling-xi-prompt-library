<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵犀指令库 · 代码生成</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <nav class="nav-bar">
      <span class="nav-brand">灵犀指令库</span>
      <ul class="nav-menu"><li class="nav-item"><a href="index.html">首页</a></li></ul>
    </nav>
    <div id="stars"></div><div id="stars2"></div><div id="stars3"></div>
    <div class="glass-reader">
      <div class="reader-header"><h2>代码生成类</h2></div>
      <div class="reader-content">
        
        <!-- 代码生成 - 升级：拆解+伪代码+错误预警 -->
        <div class="prompt-builder prompt-builder--accordion" data-template="我是一名{role}，需要用{language}实现{need}功能。
1. 需求拆解：先将我的需求拆成2-5个关键子功能点。
2. 伪代码逻辑：输出伪代码描述主流程。
3. 代码实现：基于伪代码写出带注释的{language}代码，遵循{requirements}。
4. 潜在错误预警：列出3个常见错误及修复方法。
5. 运行说明：说明如何运行，包括环境要求。">
          <button class="prompt-builder__trigger" type="button" aria-expanded="false">
            <span class="prompt-builder__title">代码生成</span>
            <span class="prompt-builder__arrow">展开</span>
          </button>
          <div class="prompt-builder__body">
            <div class="prompt-builder__desc">基础语法、功能模块、脚本编写</div>
            <div class="prompt-builder__fields">
              <label>身份/角色<input data-key="role" type="text" placeholder="例如：前端新手"></label>
              <label>编程语言<input data-key="language" type="text" placeholder="例如：JavaScript"></label>
              <label>功能需求<input data-key="need" type="text" placeholder="例如：表单校验"></label>
              <label class="prompt-builder__wide">详细要求<textarea data-key="requirements" rows="3" placeholder="例如：每行有注释，兼容移动端，使用ES6语法"></textarea></label>
              <label class="chain-check"><input type="checkbox" data-key="chain"> 启用深度思考（思维链）</label>
            </div>
            <div class="prompt-builder__output" aria-live="polite"></div>
            <button class="copy-button" type="button">一键复制</button>
          </div>
        </div>

        <!-- 代码调试 - 保留原有逻辑，微调 -->
        <div class="prompt-builder prompt-builder--accordion" data-template="以下{language}代码报错：{error}。代码：{code}。请先列出{count}种可能出错位置，再给出修正代码，并解释修改原因。">
          <button class="prompt-builder__trigger" type="button" aria-expanded="false">
            <span class="prompt-builder__title">代码调试</span>
            <span class="prompt-builder__arrow">展开</span>
          </button>
          <div class="prompt-builder__body">
            <div class="prompt-builder__desc">错误排查、语法修正、优化建议</div>
            <div class="prompt-builder__fields">
              <label>编程语言<input data-key="language" type="text" placeholder="例如：Python"></label>
              <label>报错信息<input data-key="error" type="text" placeholder="例如：TypeError: ..."></label>
              <label>排查数量<input data-key="count" type="text" placeholder="例如：3"></label>
              <label class="prompt-builder__wide">代码内容<textarea data-key="code" rows="5" placeholder="粘贴报错代码"></textarea></label>
            </div>
            <div class="prompt-builder__output" aria-live="polite"></div>
            <button class="copy-button" type="button">一键复制</button>
          </div>
        </div>

        <!-- 代码解释 - 优化：逐段说明+复杂度分析 -->
        <div class="prompt-builder prompt-builder--accordion" data-template="请解释以下{language}代码的主要用法，假设读者是{audience}。逐段说明逻辑，并补充时间复杂度、空间复杂度和关键注意事项。代码：{code}">
          <button class="prompt-builder__trigger" type="button" aria-expanded="false">
            <span class="prompt-builder__title">代码解释</span>
            <span class="prompt-builder__arrow">展开</span>
          </button>
          <div class="prompt-builder__body">
            <div class="prompt-builder__desc">语法说明、逻辑解读、功能说明</div>
            <div class="prompt-builder__fields">
              <label>编程语言<input data-key="language" type="text" placeholder="例如：Java"></label>
              <label>目标读者<input data-key="audience" type="text" placeholder="例如：刚接触Java的开发者"></label>
              <label class="prompt-builder__wide">代码内容<textarea data-key="code" rows="5" placeholder="粘贴需要解释的代码"></textarea></label>
            </div>
            <div class="prompt-builder__output" aria-live="polite"></div>
            <button class="copy-button" type="button">一键复制</button>
          </div>
        </div>

        <!-- 脚本开发 - 优化：异常预测+运行说明 -->
        <div class="prompt-builder prompt-builder--accordion" data-template="请用{language}开发一个脚本，用于{task}。要求：{requirements}。在生成脚本前，先预测可能出现的异常情况并给出处理方案，生成后说明如何运行。">
          <button class="prompt-builder__trigger" type="button" aria-expanded="false">
            <span class="prompt-builder__title">脚本开发</span>
            <span class="prompt-builder__arrow">展开</span>
          </button>
          <div class="prompt-builder__body">
            <div class="prompt-builder__desc">自动化脚本、简单工具脚本</div>
            <div class="prompt-builder__fields">
              <label>编程语言<input data-key="language" type="text" placeholder="例如：Python"></label>
              <label>脚本任务<input data-key="task" type="text" placeholder="例如：提取Excel第一列保存为txt"></label>
              <label class="prompt-builder__wide">脚本要求<textarea data-key="requirements" rows="4" placeholder="例如：支持大文件读取、记录日志、处理异常"></textarea></label>
            </div>
            <div class="prompt-builder__output" aria-live="polite"></div>
            <button class="copy-button" type="button">一键复制</button>
          </div>
        </div>
      </div>
      <div class="reader-footer">✦ 磨砂玻璃视界 · 可承载数万字内容 ✦ 滚动流畅 · 沉浸阅读</div>
    </div>
  </div>
  <script src="prompt-builder.js"></script>
</body>
</html>
